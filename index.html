<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio Diccionario</title>
  
  <style>
    /* Estilos extraídos de CSS */
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4; /* Añadí un color de fondo básico por si acaso */
      margin: 0;
    }

    .wrap {
      max-width: 420px;
      margin: auto;
      padding: 10px;
      text-align: center;
    }

    .cover {
      width: 100%;
      border-radius: 18px;
      transition: opacity 0.3s ease; /* Pequeña transición para suavizar el cambio de imagen */
    }

    button {
      padding: 10px 16px;
      margin: 8px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.13);
      font-size: 20px;
      font-weight: bold;
    }

    #play {
      width: 200px;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: #007bff;
      color: white;
      font-weight: bold;
      font-size: 20px;
      cursor: pointer;
      transition: .2s;
    }

    .jump {
      display: block;
      width: 100%;
      margin: 0;
      background: #007bff;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .active {
      background: #ff8c1a !important;
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 140, 26, 0.8);
    }

    /* =========================================================
       BARRA DE PROGRESO
       ========================================================= */

    input[type="range"] {
      width: 80%;
      display: block;
      margin: 10px auto 15px auto;
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(to right, #007bff 0%, #007bff 0%, #e0e0e0 0%, #e0e0e0 100%);
      outline: none;
      border-radius: 4px;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      background: transparent;
      border-radius: 4px;
    }

    input[type="range"]::-moz-range-track {
      width: 100%;
      height: 6px;
      background: transparent;
      border-radius: 4px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #007bff;
      cursor: pointer;
      margin-top: -6px;
    }

    input[type="range"]::-moz-range-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #007bff;
      border: none;
      cursor: pointer;
    }

    #cur, #dur {
      font-size: 18px;
      font-weight: bold;
    }

    #buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    /* =========================================================
       BOTÓN FINAL CON IMAGEN
       ========================================================= */

    .contenedor-enlace-web {
      text-align: center;
      margin-top: 25px; 
      margin-bottom: 15px;
      width: 100%;
    }

    .enlace-imagen {
      display: inline-block;
      text-decoration: none;
    }

    .imagen-boton {
      max-width: 260px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      transition: transform 0.2s ease;
    }

    .imagen-boton:hover {
      transform: scale(1.05);
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <img id="cover-img" src="portada.png" class="cover" alt="Portada">
    
    <audio id="a" src="audio.mp3"></audio>
    
    <button id="play">▶ Hear</button>
    
    <input id="prog" type="range" min="0" value="0">
    
    <div>
      <span id="cur">0:00</span> / <span id="dur">0:00</span>
    </div>

    <div id="buttons"></div>

    <div class="contenedor-enlace-web">
      <a href="https://readmindbk.github.io/WEB/" class="enlace-imagen" target="_blank">
        <img class="imagen-boton" src="web.png" alt="Sitio Web">
      </a>
    </div>

  </div>

  <script>
    /* =========================================================
       SECCIONES DEL AUDIO Y SUS IMÁGENES
       ========================================================= */

    // CAMBIO 2: Agregamos la propiedad 'img' a cada sección.
    // Aquí es donde tú puedes manipular qué imagen se muestra en cada momento.
    const sections = [
      {t: 21, n: '1 Egyptian', img: '1.png'},
      {t: 52.5, n: '2 Mesopotamian', img: '2.png'},
      {t: 79, n: '3 Persian', img: '3.png'},
      {t: 106, n: '4 Greek', img: '4.png'},
      {t: 134, n: '5 Roman', img: '5.png'},
      {t: 161, n: '6 European', img: '6.png'},
      {t: 190, n: '7 Japanese', img: '7.png'},
      {t: 218, n: '8 Hindu', img: '8.png'},
      {t: 242, n: '9 Norse', img: '9.png'},
      {t: 269, n: '10 Celtic / Irish', img: '10.png'},
      {t: 298, n: '11 Algonquin', img: '11.png'},
      {t: 328, n: '12 Latin American', img: '12.png'},
      {t: 358.5, n: '13 Himalayan', img: '13.png'},
      {t: 388, n: '14 Medieval', img: '14.png'}
    ];


 /* NUEVO: Variables para la despedida */
    const tiempoDespedida = 416; // Segundo exacto donde inicia la despedida
    const imagenDespedida = 'portada.png'; // Nombre de la imagen final

    /* =========================================================
       ELEMENTOS HTML
       ========================================================= */

    const a = document.getElementById('a');
    const b = document.getElementById('buttons');
    const p = document.getElementById('play');
    const pr = document.getElementById('prog');
    const c = document.getElementById('cur');
    const d = document.getElementById('dur');
    const coverImg = document.getElementById('cover-img'); 


    /* =========================================================
       CREAR BOTONES DE SALTO
       ========================================================= */

    sections.forEach((s) => {
      const bt = document.createElement('button');
      bt.className = 'jump';
      bt.textContent = s.n;
      bt.onclick = () => {
        a.currentTime = s.t;
      };
      b.appendChild(bt);
    });

    /* =========================================================
       FORMATEAR TIEMPO
       ========================================================= */

    function fmt(x) {
      if (isNaN(x)) return "0:00";
      const min = Math.floor(x / 60);
      const sec = Math.floor(x % 60);
      return `${min}:${String(sec).padStart(2, '0')}`;
    }

    /* =========================================================
       ACTUALIZAR COLOR DE LA BARRA
       ========================================================= */

    function updateProgressBar() {
      if (!a.duration || !isFinite(a.duration)) {
        return;
      }
      const percentage = (a.currentTime / a.duration) * 100;
      pr.style.background = `
        linear-gradient(
          to right,
          #007bff 0%,
          #007bff ${percentage}%,
          #e0e0e0 ${percentage}%,
          #e0e0e0 100%
        )
      `;
    }

    /* =========================================================
       BOTÓN REPRODUCIR / PAUSE
       ========================================================= */

    p.onclick = () => {
      if (a.paused) {
        a.play();
        p.textContent = "⏸ Pausa";
        p.animate(
          [
            { transform: "scale(1.2)" },
            { transform: "scale(1.08)" },
            { transform: "scale(1.2)" }
          ],
          { duration: 250 }
        );
      } else {
        a.pause();
        p.textContent = "▶ Escuchar";
      }
    };

    /* =========================================================
       CUANDO SE CONOCE LA DURACIÓN DEL AUDIO
       ========================================================= */

    a.addEventListener("loadedmetadata", () => {
      pr.min = 0;
      pr.max = a.duration;
      pr.step = 0.01;
      pr.value = 0;
      c.textContent = fmt(0);
      d.textContent = fmt(a.duration);
      updateProgressBar();
    });

    /* =========================================================
       ACTUALIZAR BARRA, TIEMPO, CAPÍTULO E IMAGEN
       ========================================================= */

    a.addEventListener("timeupdate", () => {
      /* Actualizar posición y tiempo */
      pr.value = a.currentTime;
      c.textContent = fmt(a.currentTime);
      updateProgressBar();

      /* COMPROBAR SI ESTAMOS EN LA DESPEDIDA */
      if (a.currentTime >= tiempoDespedida) {
        
        // 1. Desactivar todos los botones
        document.querySelectorAll(".jump").forEach(btn => {
          btn.classList.remove("active");
        });

        // 2. Colocar la imagen de despedida
        if (coverImg.getAttribute('src') !== imagenDespedida) {
          coverImg.src = imagenDespedida;
        }

      } else {
        // COMPORTAMIENTO NORMAL DURANTE EL AUDIO

        /* Determinar capítulo activo */
        const activeIndex = sections.filter(s => a.currentTime >= s.t).length - 1;

        /* Actualizar botones visuales */
        document.querySelectorAll(".jump").forEach((btn, i) => {
          btn.classList.toggle("active", i === activeIndex);
        });

        /* Actualizar la imagen de portada */
        const targetImage = activeIndex >= 0 ? sections[activeIndex].img : 'portada.png';
        
        if (coverImg.getAttribute('src') !== targetImage) {
          coverImg.src = targetImage;
        }
      }
    });

    /* =========================================================
       PERMITIR MOVER LA BARRA MANUALMENTE
       ========================================================= */

    pr.addEventListener("input", () => {
      a.currentTime = Number(pr.value);
      updateProgressBar();
    });

    /* =========================================================
       CUANDO TERMINA EL AUDIO
       ========================================================= */

    a.addEventListener("ended", () => {
      p.textContent = "▶ Escuchar";
      pr.value = pr.max;
      updateProgressBar();
    });

  </script>
</body>
</html>
